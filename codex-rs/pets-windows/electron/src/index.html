<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self';"
    />
    <title>Codex Pets</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="overlay" class="overlay is-idle">
      <section id="contentFrame" class="content-frame">
        <section id="tray" class="notification-tray" aria-live="polite">
          <div id="trayInner" class="notification-tray-inner">
            <article class="notification-card">
              <button
                id="notificationAction"
                class="notification-action"
                type="button"
                aria-label="Open notification"
              >
                <span class="notification-copy">
                  <span id="title" class="notification-title">Codex</span>
                  <span id="body" class="notification-body">Thinking</span>
                </span>
              </button>
              <span id="statusIcon" class="status-icon spinner" aria-hidden="true"></span>
            </article>
          </div>
        </section>
        <section id="mascotFrame" class="mascot-frame">
          <div
            id="mascotButton"
            class="mascot-button"
            role="img"
            aria-label="Codex pet"
            data-avatar-mascot="true"
          >
            <span id="avatar" class="codex-avatar-root" aria-hidden="true"></span>
            <button
              id="badge"
              class="notification-badge no-drag"
              type="button"
              aria-label="Collapse activity"
              hidden
            >
              <span id="badgeContent">1</span>
            </button>
          </div>
        </section>
      </section>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
